<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%" height="auto">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap');

      .mono {
        font-family: 'JetBrains Mono', 'SF Pro Mono', 'Fira Code', 'Roboto Mono', Menlo, Monaco, Consolas, monospace;
      }

      .footer-lead {
        fill: #F5F5F5;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2px;
      }

      .footer-sub {
        fill: #737373;
        font-size: 10px;
        font-weight: 400;
        letter-spacing: 1.5px;
      }

      @keyframes wave-shift {
        0% { transform: translateX(0); }
        100% { transform: translateX(-80px); }
      }

      @keyframes pulse-dot {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }

      .wave-line-1 {
        animation: wave-shift 6s linear infinite;
      }

      .wave-line-2 {
        animation: wave-shift 10s linear infinite;
      }

      .pulse-1 { animation: pulse-dot 2s ease-in-out infinite; }
      .pulse-2 { animation: pulse-dot 2s ease-in-out infinite 0.6s; }
      .pulse-3 { animation: pulse-dot 2s ease-in-out infinite 1.2s; }

      @media (prefers-reduced-motion: reduce) {
        .wave-line-1, .wave-line-2, .pulse-1, .pulse-2, .pulse-3 {
          animation: none;
        }
      }
    </style>

    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#171717" stroke-width="0.75"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="120" rx="8" fill="#050505" stroke="#262626" stroke-width="1"/>
  <rect width="800" height="120" rx="8" fill="url(#grid-pattern)" opacity="0.6"/>

  <!-- Top Border Accent -->
  <line x1="0" y1="1" x2="800" y2="1" stroke="#262626" stroke-width="1"/>

  <!-- Waveform Animation Track -->
  <g opacity="0.45" transform="translate(0, 32)">
    <g class="wave-line-1">
      <path d="M 0,15 Q 20,0 40,15 T 80,15 T 120,15 T 160,15 T 200,15 T 240,15 T 280,15 T 320,15 T 360,15 T 400,15 T 440,15 T 480,15 T 520,15 T 560,15 T 600,15 T 640,15 T 680,15 T 720,15 T 760,15 T 800,15 T 840,15 T 880,15"
            fill="none" stroke="#737373" stroke-width="1"/>
    </g>
    <g class="wave-line-2">
      <path d="M 0,15 Q 30,28 60,15 T 120,15 T 180,15 T 240,15 T 300,15 T 360,15 T 420,15 T 480,15 T 540,15 T 600,15 T 660,15 T 720,15 T 780,15 T 840,15 T 900,15"
            fill="none" stroke="#404040" stroke-width="1" stroke-dasharray="3,3"/>
    </g>
  </g>

  <!-- Centered Branding & Status Indicators -->
  <g transform="translate(400, 78)">
    <circle cx="-160" cy="-3" r="3" fill="#FFFFFF" class="pulse-1"/>
    <circle cx="-146" cy="-3" r="3" fill="#A3A3A3" class="pulse-2"/>
    <circle cx="-132" cy="-3" r="3" fill="#525252" class="pulse-3"/>

    <text text-anchor="middle" class="mono footer-lead">SYSTEM ACTIVE // ARCHITECTURE STABLE</text>

    <circle cx="132" cy="-3" r="3" fill="#525252" class="pulse-3"/>
    <circle cx="146" cy="-3" r="3" fill="#A3A3A3" class="pulse-2"/>
    <circle cx="160" cy="-3" r="3" fill="#FFFFFF" class="pulse-1"/>
  </g>

  <g transform="translate(400, 98)">
    <text text-anchor="middle" class="mono footer-sub">RAMI GLITCH · BUILD · BREAK · LEARN · SOLVE · REPEAT</text>
  </g>
</svg>
