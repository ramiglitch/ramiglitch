<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="auto">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap');

      .mono {
        font-family: 'JetBrains Mono', 'SF Pro Mono', 'Fira Code', 'Roboto Mono', Menlo, Monaco, Consolas, monospace;
      }

      .text-title { fill: #737373; font-size: 12px; font-weight: 500; letter-spacing: 0.5px; }
      .text-prompt { fill: #737373; font-size: 13px; font-weight: 500; }
      .text-cmd { fill: #F5F5F5; font-size: 13px; font-weight: 700; }
      .text-output { fill: #D4D4D4; font-size: 13px; font-weight: 400; }
      .text-accent { fill: #FFFFFF; font-size: 13px; font-weight: 600; }
      .text-muted { fill: #525252; font-size: 13px; }

      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      .cursor {
        fill: #FFFFFF;
        animation: blink 1s infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .cursor { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect x="0.5" y="0.5" width="799" height="359" rx="8" fill="#000000" stroke="#262626" stroke-width="1"/>

  <!-- Window Header Bar -->
  <path d="M 0.5 8.5 A 8 8 0 0 1 8.5 0.5 L 791.5 0.5 A 8 8 0 0 1 799.5 8.5 L 799.5 36.5 L 0.5 36.5 Z" fill="#0A0A0A" stroke="#262626" stroke-width="1"/>
  <line x1="0" y1="36" x2="800" y2="36" stroke="#262626" stroke-width="1"/>

  <!-- Window Control Buttons (Strict Monochrome) -->
  <circle cx="20" cy="18" r="5" fill="#262626"/>
  <circle cx="36" cy="18" r="5" fill="#333333"/>
  <circle cx="52" cy="18" r="5" fill="#404040"/>

  <!-- Terminal Title -->
  <text x="400" y="22" text-anchor="middle" class="mono text-title">rami@glitch-core:~ (zsh)</text>

  <!-- Content Line 1: whoami -->
  <g transform="translate(24, 70)">
    <text class="mono">
      <tspan class="text-prompt">ramiglitch@host:~$ </tspan>
      <tspan class="text-cmd">whoami</tspan>
    </text>
  </g>

  <g transform="translate(24, 94)">
    <text class="mono text-output">
      <tspan class="text-accent">Rami GLITCH</tspan> — Full-Stack Developer · AI-Native Engineer · Security Enthusiast
    </text>
  </g>

  <!-- Content Line 2: cat manifest.json -->
  <g transform="translate(24, 136)">
    <text class="mono">
      <tspan class="text-prompt">ramiglitch@host:~$ </tspan>
      <tspan class="text-cmd">cat manifest.json | jq .focus_areas</tspan>
    </text>
  </g>

  <g transform="translate(24, 160)">
    <text class="mono text-output">
      <tspan class="text-muted">[</tspan>
    </text>
  </g>
  <g transform="translate(40, 182)">
    <text class="mono text-output">
      <tspan class="text-accent">"Vibe Coding &amp; Agentic Workflows"</tspan><tspan class="text-muted">,</tspan>
    </text>
  </g>
  <g transform="translate(40, 204)">
    <text class="mono text-output">
      <tspan class="text-accent">"Autonomous Agent Harnesses &amp; Tooling"</tspan><tspan class="text-muted">,</tspan>
    </text>
  </g>
  <g transform="translate(40, 226)">
    <text class="mono text-output">
      <tspan class="text-accent">"Cybersecurity &amp; Network Reconnaissance"</tspan><tspan class="text-muted">,</tspan>
    </text>
  </g>
  <g transform="translate(40, 248)">
    <text class="mono text-output">
      <tspan class="text-accent">"Resilient Architecture &amp; Scalable APIs"</tspan>
    </text>
  </g>
  <g transform="translate(24, 270)">
    <text class="mono text-output">
      <tspan class="text-muted">]</tspan>
    </text>
  </g>

  <!-- Content Line 3: status -->
  <g transform="translate(24, 312)">
    <text class="mono">
      <tspan class="text-prompt">ramiglitch@host:~$ </tspan>
      <tspan class="text-cmd">echo $CORE_PHILOSOPHY</tspan>
    </text>
  </g>

  <g transform="translate(24, 334)">
    <text class="mono text-output">
      <tspan class="text-accent">"I direct the AI. I own the architecture."</tspan>
      <tspan class="cursor" dx="6">_</tspan>
    </text>
  </g>
</svg>
