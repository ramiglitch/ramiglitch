<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="auto">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&amp;display=swap');

      .mono {
        font-family: 'JetBrains Mono', 'SF Pro Mono', 'Fira Code', 'Roboto Mono', Menlo, Consolas, monospace;
      }

      .node-title {
        fill: #E7F8FF;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1px;
      }

      .node-sub {
        fill: #737A8C;
        font-size: 9px;
        font-weight: 500;
      }

      .core-title {
        fill: #E7F8FF;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 2px;
      }

      .core-sub {
        fill: #A30F2D;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 1.5px;
      }

      @keyframes pulse-ring {
        0% { r: 38px; opacity: 0.8; }
        50% { r: 46px; opacity: 0.2; }
        100% { r: 38px; opacity: 0.8; }
      }

      @keyframes dash-flow {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -40; }
      }

      .pulse-core-ring {
        animation: pulse-ring 3.5s ease-in-out infinite;
      }

      .signal-line {
        stroke-dasharray: 6, 6;
        animation: dash-flow 4s linear infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .pulse-core-ring, .signal-line { animation: none; }
      }
    </style>

    <pattern id="grid-core" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#0E121A" stroke-width="0.75"/>
    </pattern>

    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#285A83" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#050609" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#050609" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <!-- Container Base -->
  <rect width="800" height="360" rx="4" fill="#050609" stroke="#171A22" stroke-width="1"/>
  <rect width="800" height="360" rx="4" fill="url(#grid-core)" opacity="0.6"/>

  <!-- Tactical Header -->
  <text x="24" y="24" class="mono" fill="#A30F2D" font-size="9.5" font-weight="700" letter-spacing="2px">SECTION 02 // TOPOLOGICAL MAPPING: THE FROZEN CORE</text>
  <text x="630" y="24" class="mono" fill="#737A8C" font-size="9" font-weight="500">ENGINEERING INTERCONNECTIVITY</text>
  <line x1="24" y1="32" x2="776" y2="32" stroke="#171A22" stroke-width="1"/>

  <!-- Radial Connector Rays (Ice Blue & Blood Red Accents) -->
  <line x1="400" y1="180" x2="400" y2="70" stroke="#285A83" stroke-width="1.5" class="signal-line"/>
  <line x1="400" y1="180" x2="620" y2="105" stroke="#285A83" stroke-width="1.5"/>
  <line x1="400" y1="180" x2="620" y2="255" stroke="#285A83" stroke-width="1.5" class="signal-line"/>
  <line x1="400" y1="180" x2="400" y2="295" stroke="#A30F2D" stroke-width="1.5"/>
  <line x1="400" y1="180" x2="180" y2="255" stroke="#A30F2D" stroke-width="1.5" class="signal-line"/>
  <line x1="400" y1="180" x2="180" y2="105" stroke="#285A83" stroke-width="1.5"/>

  <!-- Satellite Connection Hexagon Ring -->
  <polygon points="400,70 620,105 620,255 400,295 180,255 180,105" fill="none" stroke="#171A22" stroke-width="1" stroke-dasharray="3,6"/>

  <!-- Central Core Node -->
  <circle cx="400" cy="180" r="46" fill="url(#center-glow)"/>
  <circle cx="400" cy="180" r="38" fill="none" stroke="#A7E8FF" stroke-width="1" class="pulse-core-ring"/>
  <circle cx="400" cy="180" r="34" fill="#0A0E17" stroke="#285A83" stroke-width="2"/>
  <text x="400" y="176" text-anchor="middle" class="mono core-title">VIBE CODING</text>
  <text x="400" y="192" text-anchor="middle" class="mono core-sub">ARCHITECT CORE</text>

  <!-- Node 1: Top (AI & Agentic Systems) -->
  <g transform="translate(400, 70)">
    <rect x="-110" y="-22" width="220" height="44" rx="3" fill="#0A0E17" stroke="#285A83" stroke-width="1.5"/>
    <circle cx="-95" cy="0" r="3.5" fill="#A7E8FF"/>
    <text x="-80" y="-3" class="mono node-title">AI &amp; AGENT HARNESSES</text>
    <text x="-80" y="12" class="mono node-sub">MCP · Local LLMs (Ollama) · Multi-Agent</text>
  </g>

  <!-- Node 2: Top-Right (Full-Stack & APIs) -->
  <g transform="translate(620, 105)">
    <rect x="-10" y="-22" width="170" height="44" rx="3" fill="#0A0E17" stroke="#285A83" stroke-width="1.2"/>
    <circle cx="5" cy="0" r="3.5" fill="#A7E8FF"/>
    <text x="18" y="-3" class="mono node-title">FULL-STACK &amp; APIS</text>
    <text x="18" y="12" class="mono node-sub">React 19 · Node.js · FastAPI</text>
  </g>

  <!-- Node 3: Bottom-Right (Languages & Runtimes) -->
  <g transform="translate(620, 255)">
    <rect x="-10" y="-22" width="170" height="44" rx="3" fill="#0A0E17" stroke="#285A83" stroke-width="1.2"/>
    <circle cx="5" cy="0" r="3.5" fill="#A7E8FF"/>
    <text x="18" y="-3" class="mono node-title">LANGUAGES &amp; RUNTIMES</text>
    <text x="18" y="12" class="mono node-sub">TypeScript · Python · C++ · C#</text>
  </g>

  <!-- Node 4: Bottom (Data & Infrastructure) -->
  <g transform="translate(400, 295)">
    <rect x="-110" y="-22" width="220" height="44" rx="3" fill="#0A0E17" stroke="#171A22" stroke-width="1.2"/>
    <circle cx="-95" cy="0" r="3.5" fill="#737A8C"/>
    <text x="-80" y="-3" class="mono node-title">DATA &amp; INFRASTRUCTURE</text>
    <text x="-80" y="12" class="mono node-sub">PostgreSQL · Supabase · Docker · Linux</text>
  </g>

  <!-- Node 5: Bottom-Left (Cybersecurity & Recon) - Blood Red Accented -->
  <g transform="translate(180, 255)">
    <rect x="-160" y="-22" width="170" height="44" rx="3" fill="#0E0508" stroke="#A30F2D" stroke-width="1.5"/>
    <circle cx="-145" cy="0" r="3.5" fill="#A30F2D"/>
    <text x="-132" y="-3" class="mono" fill="#E7F8FF" font-size="11" font-weight="700">CYBERSECURITY &amp; RECON</text>
    <text x="-132" y="12" class="mono" fill="#A8ABB5" font-size="9" font-weight="500">Wireshark · Nmap · OSINT · Audit</text>
  </g>

  <!-- Node 6: Top-Left (Engineering Ownership) -->
  <g transform="translate(180, 105)">
    <rect x="-160" y="-22" width="170" height="44" rx="3" fill="#0A0E17" stroke="#285A83" stroke-width="1.2"/>
    <circle cx="-145" cy="0" r="3.5" fill="#A7E8FF"/>
    <text x="-132" y="-3" class="mono node-title">ENGINEERING RIGOR</text>
    <text x="-132" y="12" class="mono node-sub">Architecture Ownership · Strict Diff</text>
  </g>
</svg>
