<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="auto">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&amp;display=swap');

      .mono {
        font-family: 'JetBrains Mono', 'SF Pro Mono', 'Fira Code', 'Roboto Mono', Menlo, Consolas, monospace;
      }

      .title-dossier {
        fill: #A30F2D;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 2.5px;
      }

      .meta-label {
        fill: #737A8C;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 1.5px;
      }

      .hero-name {
        fill: #E7F8FF;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 5px;
      }

      .hero-disciplines {
        fill: #A7E8FF;
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 2px;
      }

      .hero-quote {
        fill: #A8ABB5;
        font-size: 12px;
        font-weight: 400;
        letter-spacing: 1px;
      }

      .quote-highlight {
        fill: #E7F8FF;
        font-weight: 600;
      }

      @keyframes pulse-beacon {
        0%, 100% { fill: #A30F2D; opacity: 1; }
        50% { fill: #490817; opacity: 0.35; }
      }

      @keyframes fissure-drift {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -120; }
      }

      .beacon {
        animation: pulse-beacon 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      .fissure-line {
        stroke-dasharray: 24, 16, 4, 16;
        animation: fissure-drift 12s linear infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .beacon, .fissure-line { animation: none; }
      }
    </style>

    <pattern id="forensic-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#10141D" stroke-width="0.75"/>
    </pattern>

    <linearGradient id="frost-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#285A83" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#A7E8FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#285A83" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="blood-fissure-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#285A83" stop-opacity="0.2"/>
      <stop offset="30%" stop-color="#A30F2D" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#A30F2D" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#285A83" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Base Obsidian Background -->
  <rect width="800" height="240" rx="4" fill="#050609" stroke="#171A22" stroke-width="1"/>
  <rect width="800" height="240" rx="4" fill="url(#forensic-grid)" opacity="0.7"/>

  <!-- Frozen Edge Frame & Corner Brackets -->
  <path d="M 2 24 L 2 2 L 24 2" fill="none" stroke="#A7E8FF" stroke-width="2"/>
  <path d="M 776 2 L 798 2 L 798 24" fill="none" stroke="#A7E8FF" stroke-width="2"/>
  <path d="M 2 216 L 2 238 L 24 238" fill="none" stroke="#A7E8FF" stroke-width="2"/>
  <path d="M 776 238 L 798 238 L 798 216" fill="none" stroke="#A7E8FF" stroke-width="2"/>

  <!-- Header Header Division Bar -->
  <line x1="24" y1="44" x2="776" y2="44" stroke="#171A22" stroke-width="1"/>
  <line x1="24" y1="44" x2="160" y2="44" stroke="#A30F2D" stroke-width="2"/>

  <!-- Top Metadata -->
  <text x="24" y="28" class="mono title-dossier">[DOSSIER // 0x7F-RG: CLASSIFIED PERSONNEL FILE]</text>
  <text x="610" y="28" class="mono meta-label">LOC: 36°45'N // SYS: ACTIVE</text>
  <circle cx="768" cy="24" r="4.5" class="beacon" fill="#A30F2D"/>

  <!-- Subject Name & Callout -->
  <text x="24" y="94" class="mono hero-name">RAMI GLITCH</text>

  <!-- Disciplines Tagline -->
  <text x="24" y="126" class="mono hero-disciplines">
    <tspan fill="#A30F2D">CORE // </tspan>
    <tspan>VIBE CODING</tspan>
    <tspan fill="#737A8C"> · </tspan>
    <tspan>AUTONOMOUS AGENTS</tspan>
    <tspan fill="#737A8C"> · </tspan>
    <tspan>SYSTEMS ARCHITECTURE</tspan>
    <tspan fill="#737A8C"> · </tspan>
    <tspan fill="#E7F8FF">SECURITY RESEARCH</tspan>
  </text>

  <!-- Tactical Quote -->
  <text x="24" y="166" class="mono hero-quote">
    <tspan fill="#737A8C">&gt; </tspan>
    <tspan class="quote-highlight">&quot;ICE BUILDS THE STRUCTURE.</tspan>
    <tspan> BLOOD DRIVES THE EXECUTION.&quot;</tspan>
  </text>

  <!-- Bottom Coordinate Frame & Fissure Line -->
  <line x1="24" y1="198" x2="776" y2="198" stroke="url(#blood-fissure-grad)" stroke-width="1.5" class="fissure-line"/>

  <!-- Bottom Metadata Footnotes -->
  <text x="24" y="222" class="mono meta-label">ORCHESTRATING AGENTS // OWNING THE ARCHITECTURE // AUDITING THE DIFF</text>
  <text x="690" y="222" class="mono meta-label">SEC: VERIFIED</text>
</svg>
